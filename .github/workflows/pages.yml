name: Build and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Hourly: pick up changes to the organisation profile README
    # (security-commons-nl/.github), which cannot trigger this repo directly.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: security-commons-nl/.github
          path: org-profile
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node site/build.mjs
      # Tar zelf met hidden files, zodat .well-known/ (security.txt) meekomt;
      # upload-pages-artifact sluit dot-mappen anders uit.
      - name: Archive artifact
        shell: sh
        run: |
          tar --dereference --hard-dereference \
            --directory dist \
            -cvf "${RUNNER_TEMP}/artifact.tar" \
            --exclude=.git --exclude=.github \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
